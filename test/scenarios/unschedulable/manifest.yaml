apiVersion: v1
kind: Namespace
metadata:
  name: scenario-unschedulable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: big
  namespace: scenario-unschedulable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: big
  template:
    metadata:
      labels:
        app: big
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            # Far larger than any kind node, so the pod stays Pending.
            requests:
              cpu: "64"
              memory: 512Gi
            limits:
              cpu: "64"
              memory: 512Gi
