# Placeholder only. The real fault is a node under DiskPressure, which cannot
# be created from a manifest; see README.md. The harness skips this scenario.
apiVersion: v1
kind: Namespace
metadata:
  name: scenario-diskpressure
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger
  namespace: scenario-diskpressure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger
  template:
    metadata:
      labels:
        app: logger
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
