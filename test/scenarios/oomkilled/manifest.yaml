apiVersion: v1
kind: Namespace
metadata:
  name: scenario-oomkilled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
  namespace: scenario-oomkilled
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memory-hog
  template:
    metadata:
      labels:
        app: memory-hog
    spec:
      containers:
        - name: app
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "480M", "--vm-hang", "0"]
          resources:
            requests:
              memory: 256Mi
            limits:
              # Healthy baseline: stress allocates 480M (~458MiB), well under 1Gi.
              # fault.yaml lowers this below the working set.
              memory: 1Gi
