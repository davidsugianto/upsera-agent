# The regression: a new revision of the same Deployment with a limit below the
# ~458MiB working set that stress allocates. The rollout replaces healthy pods
# with ones that are OOM-killed shortly after start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
  namespace: scenario-oomkilled
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memory-hog
  template:
    metadata:
      labels:
        app: memory-hog
    spec:
      containers:
        - name: app
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "480M", "--vm-hang", "0"]
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
