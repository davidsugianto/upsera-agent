apiVersion: v1
kind: Namespace
metadata:
  name: scenario-imagepull
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: scenario-imagepull
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # This tag does not exist, so the pull fails with ErrImagePull and
          # then ImagePullBackOff.
          image: nginx:1.27.999
