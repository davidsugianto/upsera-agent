apiVersion: v1
kind: Namespace
metadata:
  name: scenario-probe-port
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: scenario-probe-port
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              # nginx listens on 80, so this probe can never succeed.
              path: /
              port: 8081
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: scenario-probe-port
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
