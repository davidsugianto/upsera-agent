# Copy to configs/config.yaml and adjust. config.yaml is gitignored.
#
# Secrets are never written here. Fields ending in _env name an environment
# variable; the agent reads it only at the moment the secret is used.

server:
  addr: ":8080"
  read_timeout: 15s

agent:
  # Hard stops, not warnings. An investigation that blows either budget is
  # returned as-is with whatever it found and an explicit unknowns list.
  max_tool_calls: 15
  max_cost_usd: 0.25
  max_duration: 120s

llm:
  # anthropic | openai | gemini | openai-compatible
  provider: anthropic
  # The planner (stronger model) decides which tools to call and writes the
  # final synthesis. The executor (cheaper model) handles the high-volume,
  # low-judgement steps. Validate the split against the benchmark before
  # trusting it.
  planner_model: claude-sonnet-5-5
  executor_model: claude-haiku-5-5
  api_key_env: ANTHROPIC_API_KEY
  # Only for provider: openai-compatible (for example a local Ollama or vLLM).
  base_url: ""

datadog:
  # Datadog is the only alert and telemetry source.
  site: datadoghq.com
  api_key_env: DD_API_KEY
  app_key_env: DD_APP_KEY

clusters:
  # Target clusters, reached remotely through kubeconfig contexts. The agent
  # runs outside the clusters it investigates (docs/adr/0002).
  - name: kind-upsera-lab
    kubeconfig_context: kind-upsera-lab
    namespaces:
      # Empty allow list means all namespaces except those denied.
      allow: []
      deny:
        - kube-system
        - kube-node-lease
