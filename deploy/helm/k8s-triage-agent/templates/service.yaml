{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-triage-agent.fullname" . }}
  labels:
    {{- include "k8s-triage-agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "k8s-triage-agent.selectorLabels" . | nindent 4 }}
{{- end }}
