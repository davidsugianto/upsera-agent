# Dev configuration for agent-server. Contains no secrets: keys are read from
# the environment variables named in the *_env fields.
server:
  addr: ":8080"
  read_timeout: 15s
agent:
  max_tool_calls: 15
  max_cost_usd: 0.25
  max_duration: 120s
llm:
  provider: anthropic
  # Placeholder model ids; set them to models your account can use.
  planner_model: claude-sonnet-5-5
  executor_model: claude-haiku-5-5
  api_key_env: ANTHROPIC_API_KEY
  base_url: ""
datadog:
  site: datadoghq.com
  api_key_env: DD_API_KEY
  app_key_env: DD_APP_KEY
clusters:
  - name: kind-upsera-lab
    kubeconfig_context: kind-upsera-lab
    namespaces:
      allow: []
      deny: [kube-system, kube-node-lease]
